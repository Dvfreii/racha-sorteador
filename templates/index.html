<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RachaLab · Times equilibrados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar">
    <div class="sidebar-brand">Racha<span>Lab</span></div>
    <nav>
      <a href="#topo">Inicio</a>
      <a href="#presentes">Sorteio</a>
      <a href="#elenco">Jogadores</a>
      <a href="#section-historico">Historico</a>
    </nav>
  </aside>
  <main class="container app-shell py-4" id="topo">
    <div id="flash-area"></div>

    <section class="panel mb-4" id="presentes">
      <div class="panel-heading"><span class="section-kicker">01 · PRESENTES</span><h2>Quem vai jogar?</h2></div>
      <div class="mb-2"><input id="filter-nome" class="form-control" placeholder="Filtrar por nome..." autocomplete="off"></div>
      <div id="section-list"></div>
      <div id="section-sorteio" class="mt-3"></div>
    </section>

    <section class="panel mb-4" id="elenco">
      <div class="panel-heading"><span class="section-kicker">02 · ELENCO</span><h2>Adicionar jogador</h2></div>
      <div id="section-form"></div>
    </section>

    <div id="section-historico" class="mt-4"></div>
    <div id="section-resultado" class="mt-4"></div>

    <section class="panel mb-4 import-panel" id="importacao">
      <div class="panel-heading"><div><span class="section-kicker">IMPORTACAO</span><h2>Importar jogadores</h2></div></div>
      <button id="btn-open-import" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#import-modal">Importar lista do WhatsApp</button>
    </section>
  </main>
</div>

<div id="whatsapp-container"></div>

<div class="modal fade" id="edit-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Editar jogador</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body edit-player-body"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="btn-salvar-edit">Salvar alteracoes</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="import-modal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Importar lista do WhatsApp</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <textarea id="import-textarea" class="form-control" rows="10" placeholder="Cole a lista do WhatsApp neste formato:
1 - Nome ⭐⭐⭐
2 - Nome ⭐⭐⭐⭐
...
Goleiros
1 - Nome ⭐⭐⭐"></textarea>
        <div id="import-result" class="mt-2"></div>
      </div>
      <div class="modal-footer">
        <button id="btn-importar" class="btn btn-primary">Importar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
